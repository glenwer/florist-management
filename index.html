<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glenview Florist Order Management Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .input-field {
            padding: 10px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
            outline: none;
        }

        /* ✅ 금액 입력 필드의 위/아래 스피너 화살표 제거 (상품 금액, 배달료, 텍스 비율) */
        .amount-input::-webkit-outer-spin-button,
        .amount-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .amount-input {
            -moz-appearance: textfield;
        }

        /* ── 모달 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-overlay .modal-box {
            background: white;
            border-radius: 14px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: modalIn 0.18s ease;
        }
        @keyframes modalIn {
            from { transform: translateY(18px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .modal-item {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #f3f4f6;
            transition: background 0.15s;
        }
        .modal-item:hover {
            background: #fef2f2;
            border-color: #fecaca;
        }
        .modal-item .name   { font-weight: 700; color: #1f2937; }
        .modal-item .detail { font-size: 0.75rem; color: #6b7280; margin-top: 2px; }

        /* ── 프린트 ── */
        @media print {
            /* 기본 리셋 */
            .print-hidden, .message-box { display: none !important; }
            #printTitle { display: block !important; }
            body       { background: white !important; padding: 0 !important; margin: 0 !important; font-size: 10pt; }
            .max-w-4xl { box-shadow: none !important; max-width: none !important; padding: 6px 10px !important; margin: 0 !important; }

            /* 입력 필드 → 밑줄 텍스트 스타일 */
            .input-field {
                border: none !important; padding: 1px 0 2px 0 !important;
                background: transparent !important; box-shadow: none !important;
                border-bottom: 1px dashed #999 !important;
                height: auto !important; min-height: 18px !important;
                display: block !important; width: 100% !important;
            }

            /* 헤더 */
            .main-header { border-bottom: 2px solid #fecaca !important; padding-bottom: 4px !important; margin-bottom: 10px !important; }
            .main-header h1 { font-size: 18pt !important; font-weight: 900 !important; color: #000 !important; }

            /* 레이블 */
            label { font-size: 10pt !important; font-weight: bold !important; color: #374151 !important; margin-top: 0 !important; margin-bottom: 1px !important; display: block !important; }

            /* 화면 전용 섹션 완전히 숨기기 */
            #mainInfoContainer { display: none !important; }

            /* 그리드 리셋 */
            .grid { display: block !important; }

            /* ── 프린트 전용 2컬럼 컨테이너 ── */
            #printInfoContainer {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 32px !important;
                margin-bottom: 12px !important;
                page-break-inside: avoid !important;
                align-items: start !important;
            }
            .print-col { display: block !important; }

            /* 각 행: 레이블 + 값 */
            .print-row          { margin-bottom: 2px !important; }

            /* 메세지 카드 내용: 자동 높이 (내용이 길어도 잘리지 않음) */
            #p_messageCard {
                min-height: 18px !important;
                height: auto !important;
                white-space: pre-wrap !important;
                word-break: break-word !important;
            }
            /* 오른쪽 컬럼: 주문일자에 맞춰 배달일자 등 위에 공백 추가 */
            .print-row-gap      { margin-top: 18px !important; margin-bottom: 2px !important; }

            /* ── 상품 & 금액 ── */
            #amountGrid {
                display: flex !important; flex-wrap: wrap;
                justify-content: space-between; gap: 4px;
            }
            #amountGrid > div        { width: 24% !important; margin-bottom: 0 !important; }
            #amountGrid .input-field { text-align: left !important; }
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <!-- ══════════════ 검색 결과 모달 ══════════════ -->
    <div id="searchModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-box">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-base font-bold text-gray-800">Search Results — Please Select</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-xl leading-none">&times;</button>
            </div>
            <p id="modalSubtitle" class="text-xs text-gray-500 mb-3"></p>
            <div id="modalList" class="flex flex-col gap-2 max-h-72 overflow-y-auto"></div>
        </div>
    </div>

    <!-- ══════════════ 카드번호 전체 보기 — 비밀번호 모달 ══════════════ -->
    <div id="cardPasswordModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="cardPasswordModalTitle">
        <div class="modal-box">
            <div class="flex justify-between items-center mb-4">
                <h2 id="cardPasswordModalTitle" class="text-base font-bold text-gray-800">Enter Password</h2>
                <button onclick="closeCardPasswordModal()" class="text-gray-400 hover:text-gray-700 text-xl leading-none">&times;</button>
            </div>
            <p class="text-xs text-gray-500 mb-3">Enter the password to view the full card number.</p>
            <input type="password" id="cardPasswordInput" class="input-field text-center tracking-[0.5em]" autocomplete="off"
                placeholder="••••" maxlength="4" inputmode="numeric" pattern="[0-9]*">
            <p id="cardPasswordError" class="hidden text-xs text-red-600 mt-2"></p>
            <div class="flex gap-2 justify-end mt-4">
                <button type="button" onclick="closeCardPasswordModal()"
                    class="text-sm px-3 py-1.5 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition">Cancel</button>
                <button type="button" onclick="submitCardPassword()"
                    class="text-sm px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">Confirm</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 sm:p-10">

        <!-- 타이틀 -->
        <div class="flex justify-between items-center mb-6 main-header">
            <h1 class="text-xl sm:text-2xl font-extrabold text-red-600 pb-2 cursor-pointer hover:opacity-70 transition print-hidden" onclick="handleNewButton()" title="Click to reset">Glenview Florist</h1>
            <h1 class="text-xl sm:text-2xl font-extrabold text-red-600 pb-2" style="display:none;" id="printTitle">Glenview Florist</h1>
            <div class="flex gap-2 print-hidden">
                <button type="button" id="newButton" onclick="handleNewButton()"
                    class="text-sm px-3 py-1 bg-red-600 text-white rounded-lg shadow transition hover:bg-red-700 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                    New
                </button>
                <button type="button" id="updateButton" onclick="handleFindAndUpdateButton()"
                    class="text-sm px-3 py-1 bg-blue-500 text-white rounded-lg shadow transition disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-600 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
                    Find &amp; Update
                </button>
            </div>
        </div>

        <!-- 메시지 박스 -->
        <div id="messageBox" class="hidden p-4 text-center fixed top-0 left-0 right-0 z-50 message-box">
            <span id="messageText" class="inline-block p-3 rounded-lg shadow-lg font-semibold text-sm"></span>
        </div>

        <form id="orderForm">

            <div id="mainInfoContainer">

                <!-- 고객 정보 -->
                <div id="customerInfoSection" class="mb-6 pt-2">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                        <div>
                            <label for="customerName" class="block text-sm font-medium text-gray-700 mb-1">
                                Customer Name *
                            </label>
                            <input type="text" id="customerName" name="손님 이름" required class="input-field" autocomplete="off"
                                placeholder="Type name, then press Enter">
                        </div>
                        <div>
                            <label for="orderDate" class="block text-sm font-medium text-gray-700 mb-1">Order Date *</label>
                            <input type="date" id="orderDate" name="주문 일자" required class="input-field">
                        </div>
                        <div id="customerPhoneDiv">
                            <label for="customerPhone" class="block text-sm font-medium text-gray-700 mb-1">Customer Phone *</label>
                            <input type="tel" id="customerPhone" name="손님 전화번호" required class="input-field">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div id="customerAddressDiv">
                            <label for="customerAddress" class="block text-sm font-medium text-gray-700 mb-1">Customer Address</label>
                            <input type="text" id="customerAddress" name="손님 주소" class="input-field">
                        </div>
                        <div id="creditCardDiv">
                            <div class="flex items-center justify-between mb-1">
                                <label for="creditCardNumber" class="block text-sm font-medium text-gray-700">Credit Card Number</label>
                                <button type="button" id="revealCardBtn" onclick="openCardPasswordModal()"
                                    class="hidden text-xs text-blue-500 hover:text-blue-700 font-medium print-hidden">🔓 Show Full Number</button>
                            </div>
                            <input type="text" id="creditCardNumber" name="크레딧 카드 번호" class="input-field" maxlength="30">
                        </div>
                    </div>
                </div>

                <!-- 배달 / 수신자 -->
                <div id="recipientInfoSection" class="mb-6 pt-2">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <label for="recipientName" class="text-sm font-medium text-gray-700">Recipient Name *</label>
                                <label class="flex items-center gap-1 cursor-pointer select-none print-hidden">
                                    <input type="checkbox" id="sameAsCustomer" class="w-3.5 h-3.5 accent-red-500" onchange="fillSameAsCustomer(this.checked)">
                                    <span class="text-xs text-gray-400">Same as customer</span>
                                </label>
                            </div>
                            <input type="text" id="recipientName" name="받는 사람 이름" required class="input-field">
                        </div>
                        <div>
                            <label for="deliveryDate" class="block text-sm font-medium text-gray-700 mb-1">Delivery Date *</label>
                            <input type="date" id="deliveryDate" name="배달 일자" required class="input-field">
                        </div>
                        <div>
                            <label for="recipientAddress" class="block text-sm font-medium text-gray-700 mb-1">Recipient Address *</label>
                            <input type="text" id="recipientAddress" name="받는 사람 주소" required class="input-field">
                        </div>
                        <div>
                            <label for="recipientPhone" class="block text-sm font-medium text-gray-700 mb-1">Recipient Phone *</label>
                            <input type="tel" id="recipientPhone" name="받는 사람 전화번호" required class="input-field">
                        </div>
                    </div>
                    <div class="pt-2">
                        <label for="messageCard" class="block text-sm font-medium text-gray-700 mb-1">Message Card Content</label>
                        <textarea id="messageCard" name="메세지 카드" rows="1" class="input-field"></textarea>
                    </div>
                </div>
            </div>

            <!-- ✅ 프린트 전용 2컬럼 (화면에서는 숨김) -->
            <div id="printInfoContainer" style="display:none;">
                <!-- 왼쪽: 손님 정보 -->
                <div class="print-col">
                    <div class="print-row">
                        <label>Customer Name</label>
                        <div class="input-field" id="p_customerName"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Order Date</label>
                        <div class="input-field" id="p_orderDate"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Customer Address</label>
                        <div class="input-field" id="p_customerAddress"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Customer Phone</label>
                        <div class="input-field" id="p_customerPhone"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Credit Card Number</label>
                        <div class="input-field" id="p_creditCard"></div>
                    </div>
                </div>
                <!-- 오른쪽: 받는 사람 정보 -->
                <div class="print-col">
                    <div class="print-row">
                        <label>Recipient Name</label>
                        <div class="input-field" id="p_recipientName"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Delivery Date</label>
                        <div class="input-field" id="p_deliveryDate"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Recipient Address</label>
                        <div class="input-field" id="p_recipientAddress"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Recipient Phone</label>
                        <div class="input-field" id="p_recipientPhone"></div>
                    </div>
                    <div class="print-row-gap">
                        <label>Message Card Content</label>
                        <div class="input-field" id="p_messageCard"></div>
                    </div>
                </div>
            </div>

            <!-- 상품 & 금액 -->
            <div class="mb-6 pt-4">
                <div class="mb-4">
                    <label for="productDetails" class="block text-sm font-medium text-gray-700 mb-1">Product Details *</label>
                    <textarea id="productDetails" name="상품 내용" rows="1" required class="input-field"></textarea>
                </div>
                <div id="amountGrid" class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <div>
                        <label for="productAmount" class="block text-sm font-medium text-gray-700 mb-1">Product Amount *</label>
                        <input type="number" id="productAmount" name="상품 금액" min="0" step="0.01" required class="input-field amount-input text-right" placeholder="0.00">
                    </div>
                    <div>
                        <label for="deliveryFee" class="block text-sm font-medium text-gray-700 mb-1">Delivery Fee *</label>
                        <input type="number" id="deliveryFee" name="배달료" min="0" required class="input-field amount-input text-right" placeholder="0">
                    </div>
                    <div class="print-hidden">
                        <label for="taxRateConfig" class="block text-sm font-medium text-gray-700 mb-1">Tax Rate (%) *</label>
                        <input type="number" id="taxRateConfig" name="텍스 비율" min="0" step="0.01" required class="input-field amount-input text-right" value="10.75" tabindex="-1">
                    </div>
                    <div>
                        <label for="calculatedTaxDisplay" class="block text-sm font-medium text-gray-700 mb-1">Tax</label>
                        <input type="text" id="calculatedTaxDisplay" class="input-field text-gray-900 text-right font-semibold bg-gray-100" readonly value="0.00">
                    </div>
                    <div>
                        <label for="totalAmountDisplay" class="block text-sm text-red-600 mb-1">Total</label>
                        <input type="text" id="totalAmountDisplay" class="input-field text-red-800 font-bold text-right bg-red-50" readonly value="0.00">
                    </div>
                </div>
                <input type="hidden" id="taxAmountHidden" value="0.00">
                <input type="hidden" id="totalAmountHidden" value="0.00">
                <input type="hidden" id="recordIdentifierHidden" name="searchKey" value="">
                <!-- 검색 당시 원래 주문 일자 저장 (변경 여부 감지용) -->
                <input type="hidden" id="originalOrderDateHidden" value="">
            </div>

            <!-- 버튼 -->
            <div class="pt-6 flex flex-col sm:flex-row gap-4 print-hidden">
                <button type="button" onclick="window.print()" class="w-full sm:w-1/4 bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-3 px-4 rounded-lg shadow transition">
                    🖨️ Print
                </button>
                <button type="button" id="deleteButton" onclick="handleDeleteButton()"
                    class="w-full sm:w-1/4 bg-orange-500 hover:bg-orange-600 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded-lg shadow transition">
                    🗑️ Delete Order
                </button>
                <button type="submit" id="submitButton" class="w-full sm:w-2/4 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition">
                    Save Order to Sheet
                </button>
            </div>
        </form>
    </div>

<script>
    const GOOGLE_SHEET_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx6GF11sBSEk-pi--l-SmKoaGNZ7NvpaL7p5qot_r3Yxk36kzlRJiXKyAWiYpGbg0BM/exec';

    // ── 요소 ──────────────────────────────────────────
    const form                    = document.getElementById('orderForm');
    const formFields              = document.querySelectorAll('#orderForm [name]:not([type="hidden"])');
    const customerNameInput       = document.getElementById('customerName');
    const orderDateInput          = document.getElementById('orderDate');
    const deliveryDateInput       = document.getElementById('deliveryDate');
    const productAmountInput      = document.getElementById('productAmount');
    const deliveryFeeInput        = document.getElementById('deliveryFee');
    const taxRateConfigInput      = document.getElementById('taxRateConfig');
    const totalAmountDisplayInput = document.getElementById('totalAmountDisplay');
    const taxAmountHiddenInput    = document.getElementById('taxAmountHidden');
    const totalAmountHiddenInput  = document.getElementById('totalAmountHidden');
    const calculatedTaxDisplayInput = document.getElementById('calculatedTaxDisplay');
    const updateButton            = document.getElementById('updateButton');
    const recordIdentifierHiddenInput = document.getElementById('recordIdentifierHidden');
    const searchModal             = document.getElementById('searchModal');
    const modalList               = document.getElementById('modalList');
    const modalSubtitle           = document.getElementById('modalSubtitle');
    const cardPasswordModal       = document.getElementById('cardPasswordModal');
    const cardPasswordInput       = document.getElementById('cardPasswordInput');
    const cardPasswordError       = document.getElementById('cardPasswordError');

    // ── 메시지 박스 ───────────────────────────────────
    let messageTimeout;
    function showMessage(message, styleClass) {
        const messageBox  = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');
        clearTimeout(messageTimeout);
        messageText.className = 'inline-block p-3 rounded-lg shadow-lg font-semibold text-sm';
        messageBox.classList.remove('hidden');
        messageText.textContent = message;
        if (styleClass) styleClass.split(' ').forEach(c => { if (c.trim()) messageText.classList.add(c.trim()); });
        messageTimeout = setTimeout(() => messageBox.classList.add('hidden'), 5000);
    }

    // ── 전화번호 포맷 ─────────────────────────────────
    function formatPhoneNumber(input) {
        let d = input.value.replace(/\D/g, '').substring(0, 10);
        if      (d.length <= 3) input.value = d;
        else if (d.length <= 6) input.value = d.substring(0,3)+'-'+d.substring(3);
        else                    input.value = d.substring(0,3)+'-'+d.substring(3,6)+'-'+d.substring(6);
    }
    function formatCreditCardNumber(input) {
        if (input.value.length > 30) input.value = input.value.substring(0, 30);
    }

    // ── 금액 계산 ─────────────────────────────────────
    function calculateTotal() {
        const p  = parseFloat(productAmountInput.value) || 0;
        const d  = parseFloat(deliveryFeeInput.value)   || 0;
        const r  = parseFloat(taxRateConfigInput.value) / 100 || 0;
        const M  = 10000;
        const pi = Math.round(p * M);
        const di = Math.round(d * M);
        const ti = Math.round(pi * r);
        const total = pi + di + ti;
        const tax   = (ti   / M).toFixed(2);
        const tot   = (total/ M).toFixed(2);
        calculatedTaxDisplayInput.value = tax;
        totalAmountDisplayInput.value   = tot;
        taxAmountHiddenInput.value      = tax;
        totalAmountHiddenInput.value    = tot;
    }

    // ── 날짜 오늘로 ───────────────────────────────────
    function todayStr() {
        const n = new Date();
        return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }

    // ✅ 2026년 8월 1일부터 텍스 비율 11%로 자동 전환 (그 이전엔 기존 10.75% 유지)
    function getDefaultTaxRate() {
        const cutoverDate = new Date('2026-08-01T00:00:00');
        return new Date() >= cutoverDate ? 11 : 10.75;
    }

    // ── 폼 초기화 (New 버튼 전용) ─────────────────────
    function clearAllFormFields() {
        form.reset();
        orderDateInput.value    = todayStr();
        deliveryDateInput.value = todayStr();
        productAmountInput.value = '0.00';
        deliveryFeeInput.value   = '0';
        taxRateConfigInput.value = getDefaultTaxRate(); // ✅ 2026-08-01부터 11% 자동 적용
        calculateTotal();
        recordIdentifierHiddenInput.value = '';
        document.getElementById('originalOrderDateHidden').value = '';
        const cb = document.getElementById('sameAsCustomer'); if (cb) cb.checked = false;

        // ✅ 카드번호 필드 잠금 해제 + 보기 버튼 숨기기 (New 주문은 마스킹 대상이 아님)
        document.getElementById('creditCardNumber').readOnly = false;
        document.getElementById('revealCardBtn').classList.add('hidden');
    }

    function handleNewButton() {
        clearAllFormFields();
        customerNameInput.focus();
        showMessage('✨ New order entry mode.', 'bg-red-50 text-red-700');
    }

    // ── 모달 ─────────────────────────────────────────
    function openModal(records) {
        modalList.innerHTML = '';
        modalSubtitle.textContent = `${records.length} result(s) found — select one to fill the form.`;
        records.forEach(rec => {
            const item = document.createElement('div');
            item.className = 'modal-item';
            item.innerHTML = `
                <div class="name">${rec['손님 이름'] || ''}</div>
                <div class="detail">Order: ${rec['주문 일자'] || ''} &nbsp;|&nbsp; Phone: ${rec['손님 전화번호'] || ''} &nbsp;|&nbsp; Delivery: ${rec['배달 일자'] || ''}</div>`;
            item.addEventListener('click', () => {
                populateForm(rec);
                const key = `${rec['손님 이름']}|||${rec['주문 일자']}`;
                recordIdentifierHiddenInput.value = key;
                document.getElementById('originalOrderDateHidden').value = rec['주문 일자'];
                showMessage(`✅ Loaded record for '${rec['손님 이름']}'. Edit and click "Save Order" to update.`, 'bg-green-100 text-green-800');
                closeModal();
            });
            modalList.appendChild(item);
        });
        searchModal.classList.add('open');
    }

    function closeModal() {
        searchModal.classList.remove('open');
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeModal(); closeCardPasswordModal(); }
    });
    // 배경 클릭으로 모달 닫기
    searchModal.addEventListener('click', e => { if (e.target === searchModal) closeModal(); });
    cardPasswordModal.addEventListener('click', e => { if (e.target === cardPasswordModal) closeCardPasswordModal(); });

    // ── 검색 (부분 이름 포함, 다중 결과 지원) ──────────
    // ✅ 검색은 이름만 넘어가는 GET이라 민감 정보 노출 문제 없음 — 그대로 유지
    async function searchPreviousOrder() {
        const customerName = customerNameInput.value.trim();
        if (customerName.length < 1) {
            showMessage('⚠️ Please enter at least one character of the customer\'s name.', 'bg-yellow-100 text-yellow-800');
            return;
        }

        updateButton.disabled = true;
        updateButton.innerHTML = `<svg class="animate-spin" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Searching...`;

        const url = `${GOOGLE_SHEET_APPS_SCRIPT_URL}?customerName=${encodeURIComponent(customerName)}`;
        showMessage('🔍 Searching...', 'bg-indigo-100 text-indigo-800');

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();

            if (result.result === 'success') {
                // 서버가 이미 필터링해서 보내주므로 그대로 사용
                const records = Array.isArray(result.data) ? result.data : [result.data];

                if (records.length === 0) {
                    showMessage(`ℹ️ No records match '${customerName}'.`, 'bg-yellow-100 text-yellow-800');
                    recordIdentifierHiddenInput.value = '';
                } else if (records.length === 1) {
                    // 단일 결과 → 바로 채우기
                    populateForm(records[0]);
                    recordIdentifierHiddenInput.value = `${records[0]['손님 이름']}|||${records[0]['주문 일자']}`;
                    document.getElementById('originalOrderDateHidden').value = records[0]['주문 일자'];
                    showMessage(`✅ Loaded record for '${records[0]['손님 이름']}'.`, 'bg-green-100 text-green-800');
                } else {
                    // 여러 결과 → 모달
                    openModal(records);
                }

            } else if (result.result === 'not found') {
                recordIdentifierHiddenInput.value = '';
                showMessage(`ℹ️ No record found for '${customerName}'. Please register a new order.`, 'bg-yellow-100 text-yellow-800');
            } else {
                showMessage('❌ Apps Script error. Please check the logs.', 'bg-red-100 text-red-800');
            }
        } catch (err) {
            console.error(err);
            showMessage('❌ Search failed. Please check the Apps Script deployment settings.', 'bg-red-100 text-red-800');
        } finally {
            updateButton.disabled = false;
            updateButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg> Find &amp; Update`;
        }
    }

    function handleFindAndUpdateButton() { searchPreviousOrder(); }

    // ── 손님 이름 필드: Enter 키 → 검색 ──────────────
    customerNameInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // 폼 submit 방지
            searchPreviousOrder();
        }
    });

    // ── 폼 채우기 ─────────────────────────────────────
    function populateForm(data) {
        formFields.forEach(field => {
            if (data[field.name] !== undefined) {
                let value = data[field.name];
                if (value && field.type === 'date') value = String(value).split(' ')[0];
                field.value = value;
            }
        });
        if (data['텍스 금액'])  taxAmountHiddenInput.value  = data['텍스 금액'];
        if (data['총액'])       totalAmountHiddenInput.value = data['총액'];
        if (data['텍스 비율'])  taxRateConfigInput.value     = data['텍스 비율'];
        calculateTotal();

        // ✅ 검색으로 불러온 카드번호는 마스킹된 상태이므로 필드를 잠그고
        //    "전체 보기" 버튼을 노출 (실수로 마스킹 값이 실제 값을 덮어쓰지 않도록 보호)
        if (data['크레딧 카드 번호'] !== undefined) {
            document.getElementById('creditCardNumber').readOnly = true;
            document.getElementById('revealCardBtn').classList.remove('hidden');
        }
    }

    // ── 카드번호 전체 보기 (드롭다운 모달로 비밀번호 입력 → 서버에서 실제 값 조회) ──
    function openCardPasswordModal() {
        if (!recordIdentifierHiddenInput.value) {
            showMessage('⚠️ Please search for a customer first.', 'bg-yellow-100 text-yellow-800');
            return;
        }
        cardPasswordInput.value = '';
        cardPasswordError.classList.add('hidden');
        cardPasswordModal.classList.add('open');
        setTimeout(() => cardPasswordInput.focus(), 50);
    }

    function closeCardPasswordModal() {
        cardPasswordModal.classList.remove('open');
    }

    // Enter 키로 바로 확인
    cardPasswordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); submitCardPassword(); }
    });

    // 숫자만, 4자리까지만 입력되도록 제한
    cardPasswordInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').slice(0, 4);
    });

    async function submitCardPassword() {
        const password = cardPasswordInput.value;
        cardPasswordError.classList.add('hidden');

        try {
            const response = await fetch(GOOGLE_SHEET_APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    action: 'revealCard',
                    searchKey: recordIdentifierHiddenInput.value,
                    password: password
                })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();

            if (result.result === 'success') {
                const cardInput = document.getElementById('creditCardNumber');
                cardInput.value = result.cardNumber;
                cardInput.readOnly = false; // 필요하면 바로 수정도 가능하게 잠금 해제
                closeCardPasswordModal();
                showMessage('🔓 Full card number displayed.', 'bg-green-100 text-green-800');
            } else {
                cardPasswordError.textContent = result.message || 'Incorrect password.';
                cardPasswordError.classList.remove('hidden');
            }
        } catch (err) {
            console.error(err);
            cardPasswordError.textContent = 'Request failed. Network error.';
            cardPasswordError.classList.remove('hidden');
        }
    }

    // ── 데이터 전송 (POST + text/plain — CORS preflight 회피, 응답 확인 가능) ──
    // ✅ 카드번호 등 민감 정보가 더 이상 URL 쿼리스트링에 노출되지 않음
    async function sendDataToAppsScript(action, submitButton) {
        const isUpdate = action === 'update';
        submitButton.disabled = true;
        submitButton.textContent = isUpdate ? 'Updating...' : 'Saving...';
        calculateTotal();

        const data = {
            action: isUpdate ? 'update' : 'register',
            '텍스 금액': taxAmountHiddenInput.value,
            '총액':      totalAmountHiddenInput.value,
        };
        formFields.forEach(field => { data[field.name] = field.value; });

        if (isUpdate) {
            if (recordIdentifierHiddenInput.value) {
                data['searchKey'] = recordIdentifierHiddenInput.value;
            } else {
                showMessage('⚠️ No record selected to update. Please search using "Find & Update" first.', 'bg-red-100 text-red-800');
                submitButton.disabled = false;
                submitButton.textContent = 'Save Order to Sheet';
                return;
            }
        }

        showMessage(isUpdate ? 'Updating...' : 'Saving... please wait.', 'bg-blue-100 text-blue-800');

        try {
            // ✅ Content-Type: text/plain → 브라우저가 preflight(OPTIONS) 요청을 보내지 않음
            //    (Apps Script는 OPTIONS 요청을 제대로 처리하지 못해 preflight가 있으면 실패함)
            //    본문 내용 자체는 그대로 JSON 문자열이며, 서버(doPost)에서 JSON.parse로 읽음
            const response = await fetch(GOOGLE_SHEET_APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(data)
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();

            if (result.result === 'success') {
                showMessage(
                    isUpdate ? '✅ Updated in the sheet.' : '✅ Saved to the sheet.',
                    'bg-green-100 text-green-800'
                );
                // ✅ 등록/수정 성공 후 폼을 초기화하여 다음 손님 정보와 섞이거나
                //    같은 내용을 실수로 중복 등록하는 것을 방지
                clearAllFormFields();
            } else {
                showMessage(`❌ Failed: ${result.message}`, 'bg-red-100 text-red-800');
            }

        } catch (err) {
            console.error(err);
            showMessage(`❌ ${isUpdate ? 'Update' : 'Save'} failed. Network or Apps Script error.`, 'bg-red-100 text-red-800');
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Save Order to Sheet';
        }
    }

    // ── 삭제 버튼 핸들러 (POST + text/plain — 응답 확인 가능) ──
    async function handleDeleteButton() {
        if (!recordIdentifierHiddenInput.value) {
            showMessage('⚠️ No record selected to delete. Please search using "Find & Update" first.', 'bg-yellow-100 text-yellow-800');
            return;
        }

        const name = customerNameInput.value.trim() || 'this order';
        const confirmed = confirm(`Are you sure you want to delete the order for "${name}"?\nThis action cannot be undone.`);
        if (!confirmed) return;

        const deleteButton = document.getElementById('deleteButton');
        deleteButton.disabled = true;
        deleteButton.textContent = 'Deleting...';
        showMessage('🗑️ Deleting...', 'bg-orange-100 text-orange-800');

        try {
            const response = await fetch(GOOGLE_SHEET_APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'delete', searchKey: recordIdentifierHiddenInput.value })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const result = await response.json();

            if (result.result === 'success') {
                showMessage('✅ Order deleted.', 'bg-green-100 text-green-800');
                clearAllFormFields();
            } else {
                showMessage(`❌ Delete failed: ${result.message}`, 'bg-red-100 text-red-800');
            }
        } catch (err) {
            console.error(err);
            showMessage('❌ Delete failed. Network or Apps Script error.', 'bg-red-100 text-red-800');
        } finally {
            deleteButton.disabled = false;
            deleteButton.textContent = '🗑️ Delete Order';
        }
    }


    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const submitButton = form.querySelector('button[type="submit"]');
        let action = 'register';
        if (recordIdentifierHiddenInput.value) {
            const originalDate = document.getElementById('originalOrderDateHidden').value;
            const currentDate  = orderDateInput.value;
            // 주문 일자가 변경됐으면 → 새 주문 등록, 아니면 → 업데이트
            action = (originalDate && currentDate !== originalDate) ? 'register' : 'update';
        }
        sendDataToAppsScript(action, submitButton);
    });

    // ── 주문 일자 변경 시: 새 주문 등록 모드 안내 ────
    document.getElementById('orderDate').addEventListener('change', function() {
        if (recordIdentifierHiddenInput.value) {
            const originalDate = document.getElementById('originalOrderDateHidden').value;
            if (orderDateInput.value !== originalDate) {
                showMessage('📋 Order date changed. This will be saved as a new order.', 'bg-blue-100 text-blue-800');
            } else {
                showMessage('✏️ Reverted to the original order date. This will update the existing order.', 'bg-gray-100 text-gray-700');
            }
        }
    });
    // ── 배달 일자 변경은 업데이트로 처리 (식별자 유지) ──
    document.getElementById('deliveryDate').addEventListener('change', function() {
        // 아무 처리 없음 — 업데이트로 정상 처리
    });

    // ── 전화번호 / 카드 포맷 ──────────────────────────
    document.getElementById('customerPhone').addEventListener('input',   e => formatPhoneNumber(e.target));
    document.getElementById('recipientPhone').addEventListener('input',  e => formatPhoneNumber(e.target));
    document.getElementById('creditCardNumber').addEventListener('input', e => formatCreditCardNumber(e.target));

    // ── 금액 계산 이벤트 ──────────────────────────────
    document.querySelectorAll('.amount-input').forEach(input => input.addEventListener('input', calculateTotal));

    // ✅ 금액 필드 포커스 시 기존 값 전체 선택 → 바로 타이핑해서 덮어쓸 수 있게
    document.querySelectorAll('.amount-input').forEach(input => {
        input.addEventListener('focus', function() { this.select(); });
    });

    // ── 프린트 전 값 동기화 ──────────────────────────────
    window.addEventListener('beforeprint', function() {
        document.getElementById('p_customerName').textContent     = document.getElementById('customerName').value;
        document.getElementById('p_orderDate').textContent        = document.getElementById('orderDate').value;
        document.getElementById('p_customerAddress').textContent  = document.getElementById('customerAddress').value;
        document.getElementById('p_customerPhone').textContent    = document.getElementById('customerPhone').value;
        document.getElementById('p_creditCard').textContent       = document.getElementById('creditCardNumber').value;
        document.getElementById('p_recipientName').textContent    = document.getElementById('recipientName').value;
        document.getElementById('p_deliveryDate').textContent     = document.getElementById('deliveryDate').value;
        document.getElementById('p_recipientAddress').textContent = document.getElementById('recipientAddress').value;
        document.getElementById('p_recipientPhone').textContent   = document.getElementById('recipientPhone').value;
        document.getElementById('p_messageCard').textContent      = document.getElementById('messageCard').value;
    });

    // ── 손님과 동일 체크박스 ─────────────────────────────
    function fillSameAsCustomer(checked) {
        if (checked) {
            document.getElementById('recipientName').value    = customerNameInput.value;
            document.getElementById('recipientPhone').value   = document.getElementById('customerPhone').value;
            document.getElementById('recipientAddress').value = document.getElementById('customerAddress').value;
        } else {
            document.getElementById('recipientName').value    = '';
            document.getElementById('recipientPhone').value   = '';
            document.getElementById('recipientAddress').value = '';
        }
    }

    // 손님 이름/전화/주소 변경 시 체크된 상태면 자동 동기화
    ['customerName', 'customerPhone', 'customerAddress'].forEach(id => {
        document.getElementById(id).addEventListener('input', () => {
            if (document.getElementById('sameAsCustomer').checked) {
                fillSameAsCustomer(true);
            }
        });
    });

    // ── 초기 로드 ─────────────────────────────────────
    window.onload = function() {
        orderDateInput.value    = todayStr();
        deliveryDateInput.value = todayStr();
        productAmountInput.value = '0.00';
        deliveryFeeInput.value   = '0';
        taxRateConfigInput.value = getDefaultTaxRate(); // ✅ 2026-08-01부터 11% 자동 적용
        calculateTotal();
    };
</script>
</body>
</html>
